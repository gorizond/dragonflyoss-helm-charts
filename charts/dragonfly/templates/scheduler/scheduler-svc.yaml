{{- if .Values.scheduler.enable }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "dragonfly.scheduler.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    app: {{ template "dragonfly.name" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    component: {{ .Values.scheduler.name }}
{{- if .Values.scheduler.service.labels }}
{{ toYaml .Values.scheduler.service.labels | indent 4 }}
{{- end }}
{{- if .Values.scheduler.service.annotations }}
  annotations:
{{ toYaml .Values.scheduler.service.annotations | indent 4 }}
{{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.scheduler.containerPort }}
      name: grpc
      {{- if semverCompare ">=1.20" .Capabilities.KubeVersion.Version }}
      appProtocol: grpc
      {{- end }}
      protocol: TCP
      targetPort: {{ .Values.scheduler.containerPort }}
  selector:
    app: {{ template "dragonfly.fullname" . }}
    component: {{ .Values.scheduler.name }}
{{- end }}
{{- if and .Values.scheduler.enable .Values.scheduler.clientService.enabled }}
---
# Non-headless client front with a stable ClusterIP. DaemonSets and the
# public Traefik TLS-passthrough route use this address; the P2P certificate
# carries the pinned clusterIP as an IP SAN. The headless Service above stays
# in place for peer discovery.
apiVersion: v1
kind: Service
metadata:
  name: {{ template "dragonfly.scheduler.fullname" . }}-client
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    app: {{ template "dragonfly.name" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    component: {{ .Values.scheduler.name }}
{{- if .Values.scheduler.clientService.labels }}
{{ toYaml .Values.scheduler.clientService.labels | indent 4 }}
{{- end }}
{{- if .Values.scheduler.clientService.annotations }}
  annotations:
{{ toYaml .Values.scheduler.clientService.annotations | indent 4 }}
{{- end }}
spec:
  type: ClusterIP
  {{- with .Values.scheduler.clientService.clusterIP }}
  clusterIP: {{ . | quote }}
  {{- end }}
  ports:
    - port: {{ .Values.scheduler.clientService.port | default .Values.scheduler.containerPort }}
      name: grpc
      {{- if semverCompare ">=1.20" .Capabilities.KubeVersion.Version }}
      appProtocol: grpc
      {{- end }}
      protocol: TCP
      targetPort: {{ .Values.scheduler.containerPort }}
  selector:
    app: {{ template "dragonfly.fullname" . }}
    component: {{ .Values.scheduler.name }}
{{- end }}
